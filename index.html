<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Alfa</title>

    <!-- CSS External -->
    <link rel="stylesheet" href="css\Style.CSS">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <!-- Header Content -->
     <Header class="header p-4 flex justify-between items-center">
        <!-- Logo -->
        <div class="logo"></div>
        <!-- Navigation menu -->
        <nav class="flex">
            <a class="border p-2 rounded"href="#">Home</a>
            <a class="border p-2 rounded"href="#">Our Profile</a>
            <a class="border p-2 rounded"href="#">Portfolio</a>
            <a class="border p-2 rounded"href="#">Message Us</a>
            <section class="ml-4">
                <button class="bg-green-500 text-white px-4 py-2 rounded">Login</button>
            </section>
        </nav>
        
     </Header>
     <hr>
    <!-- Main Content -->
    <Main>
        <section class="p-4 text-center">
            <h1 class="text-4xl font-bold mb-4">Welcome to My Portfolio</h1>
            <p class="mb-4">Hello! I'm Alfa, a passionate developer. Explore my work and projects below.</p>
            <div class="avatar mx-auto mb-4"></div>
            <button class="bg-blue-500 text-white px-4 py-2 rounded">Contact Me</button>
        </section>
    </Main>

    <!-- Footer Content -->
    <Footer></Footer>

    <!-- JavaScript External -->
    <script src="js\script.js"></script>
</body>
</html>
